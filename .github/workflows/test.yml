name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # The vitest binary of most packages runs on Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The API tests read the bundled OpenAPI document
      - name: Build specs
        run: bun run --filter @brio/specs build

      # The API app tests resolve the built admin app (`@brio/app` points at app/dist/index.html)
      - name: Build app
        run: bun run --filter @brio/app build

      - name: Run unit tests
        run: bun run test:unit
