table: brio_collections

defaults:
  collection: null
  hidden: false
  singleton: false
  icon: null
  note: null
  translations: null
  display_template: null
  accountability: 'all'

data:
  - collection: brio_activity
    note: $t:brio_collection.brio_activity
    accountability: null
  - collection: brio_collections
    icon: list_alt
    note: $t:brio_collection.brio_collections
  - collection: brio_fields
    icon: input
    note: $t:brio_collection.brio_fields
  - collection: brio_files
    icon: folder
    note: $t:brio_collection.brio_files
    display_template: '{{ $thumbnail }} {{ title }}'
  - collection: brio_folders
    note: $t:brio_collection.brio_folders
    display_template: '{{ name }}'
  - collection: brio_migrations
    note: $t:brio_collection.brio_migrations
  - collection: brio_permissions
    icon: admin_panel_settings
    note: $t:brio_collection.brio_permissions
  - collection: brio_presets
    icon: bookmark
    note: $t:brio_collection.brio_presets
    accountability: null
  - collection: brio_relations
    icon: merge_type
    note: $t:brio_collection.brio_relations
  - collection: brio_revisions
    note: $t:brio_collection.brio_revisions
    accountability: null
  - collection: brio_roles
    icon: supervised_user_circle
    note: $t:brio_collection.brio_roles
  - collection: brio_sessions
    note: $t:brio_collection.brio_sessions
  - collection: brio_settings
    singleton: true
    note: $t:brio_collection.brio_settings
  - collection: brio_users
    archive_field: status
    archive_value: archived
    unarchive_value: draft
    icon: people_alt
    note: $t:brio_collection.brio_users
    display_template: '{{ first_name }} {{ last_name }}'
  - collection: brio_webhooks
    note: $t:brio_collection.brio_webhooks
  - collection: brio_dashboards
    note: $t:brio_collection.brio_dashboards
  - collection: brio_panels
    note: $t:brio_collection.brio_panels
  - collection: brio_notifications
    note: $t:brio_collection.brio_notifications
  - collection: brio_shares
    icon: share
    note: $t:brio_collection.brio_shares
  - collection: brio_flows
    note: $t:brio_collection.brio_flows
  - collection: brio_operations
    note: $t:brio_collection.brio_operations
