version: '3.8'
services:
  brio:
    build: .
    ports:
      - "8055:8055"
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: brio
      DB_USER: brio
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      KEY: ${KEY:-change-this-key}
      SECRET: ${SECRET:-change-this-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brio.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      - brio-uploads:/brio/uploads
      - brio-extensions:/brio/extensions
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: brio
      POSTGRES_USER: brio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  brio-uploads:
  brio-extensions:
  postgres-data:
